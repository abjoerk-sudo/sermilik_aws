<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Sermilik Research Station AWS</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<style>

:root {
  --bg: #eef3f7;
  --panel: #ffffff;
  --text: #102333;
  --muted: #687784;
  --line: #dce5eb;
  --accent: #19647e;
  --good: #16875f;
  --warn: #d39119;
  --red: #c83232;
  --shadow: 0 7px 22px rgba(28,55,75,.07);
}


* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  min-height: 100%;
}


body {
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top right,
      #d8eaf1 0,
      transparent 32rem
    ),
    var(--bg);

  color: var(--text);
}


.page {
  width: min(1220px, calc(100% - 24px));
  margin: 0 auto;
  padding: 10px 0 12px;
}


/* ==========================================================
   TOP AREA
   ========================================================== */

.topbar {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: 18px;
  margin-bottom: 7px;
}


.eyebrow {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .12em;
  font-size: 9px;
  font-weight: 800;
  margin-bottom: 2px;
}


h1 {
  margin: 0;
  font-size: clamp(25px, 3vw, 38px);
  line-height: 1;
  letter-spacing: -.04em;
}


.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}


.ku-logo {
  display: block;
  height: 48px;
  width: auto;
  max-width: 250px;
  object-fit: contain;
}


/* ==========================================================
   STATION SELECTOR + STATUS
   ========================================================== */

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
}


.station-tabs {
  display: flex;
  gap: 6px;
}


.station-btn {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.85);
  color: var(--text);

  padding: 5px 11px;

  border-radius: 999px;

  font: inherit;
  font-size: 11px;
  font-weight: 750;

  cursor: pointer;
}


.station-btn.active {
  background: var(--text);
  color: white;
  border-color: var(--text);
}


.status-pill {
  padding: 5px 9px;

  border-radius: 999px;
  border: 1px solid var(--line);

  background: white;

  font-size: 10px;
  font-weight: 800;

  box-shadow: var(--shadow);
}


.dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  margin-right: 5px;
  background: #999;
}


.dot.good {
  background: var(--good);
}


.dot.warn {
  background: var(--warn);
}


/* ==========================================================
   GENERAL PANELS
   ========================================================== */

.panel {
  background: var(--panel);

  border: 1px solid var(--line);

  border-radius: 15px;

  box-shadow: var(--shadow);

  overflow: hidden;
}


/* ==========================================================
   UPPER GRID
   ========================================================== */

.upper-grid {
  display: grid;

  grid-template-columns:
    minmax(0, 2fr)
    minmax(250px, .72fr);

  gap: 9px;
}


/* ==========================================================
   OBSERVATIONS
   ========================================================== */

.observations-panel {
  padding: 10px;
}


.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 7px;
}


.section-title {
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: .08em;
  font-size: 9px;
  font-weight: 800;
}


.latest-time {
  color: var(--muted);
  font-size: 9px;
}


/* EXACTLY FIVE COLUMNS = TWO ROWS FOR TEN BOXES */

.current-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
}


.metric {
  min-width: 0;
  height: 82px;

  padding: 8px;

  background: #f8fafb;

  border: 2px solid transparent;
  outline: 1px solid var(--line);

  border-radius: 11px;

  cursor: pointer;

  transition:
    border-color .12s ease,
    transform .12s ease,
    background .12s ease;
}


.metric:hover {
  transform: translateY(-1px);
  background: white;
}


.metric.selected {
  border-color: var(--red);
  outline: none;
  background: white;
}


.metric.no-data {
  opacity: .48;
}


.metric-label {
  height: 22px;

  overflow: hidden;

  color: var(--muted);

  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.12;
}


.metric-value {
  margin-top: 1px;

  white-space: nowrap;

  font-size: 20px;
  line-height: 1;

  font-weight: 780;

  letter-spacing: -.035em;
}


.unit {
  margin-left: 2px;
  color: var(--muted);
  font-size: 9px;
}


.metric-time {
  margin-top: 5px;

  color: var(--muted);

  font-size: 7.5px;
  line-height: 1.05;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;
}


/* ==========================================================
   MAP
   ========================================================== */

.map-panel {
  display: flex;
  flex-direction: column;
}


#map {
  height: 152px;
}


.station-info {
  padding: 7px 10px;
  border-top: 1px solid var(--line);
  background: white;
}


.station-name {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 1px;
}


.station-meta {
  color: var(--muted);
  font-size: 8.5px;
  line-height: 1.3;
}


.source-badge {
  display: inline-block;

  margin-top: 2px;

  padding: 2px 5px;

  border-radius: 999px;

  background: #e2f0f4;

  color: var(--accent);

  font-size: 8px;
  font-weight: 750;
}


/* ==========================================================
   DELAYED MESSAGE
   ========================================================== */

.delayed-note {
  display: none;

  margin-top: 6px;

  padding: 5px 7px;

  border: 1px solid #efd895;
  border-radius: 8px;

  background: #fff6df;
  color: #765815;

  font-size: 8.5px;
}


/* ==========================================================
   GRAPH
   ========================================================== */

.chart-panel {
  margin-top: 9px;
  border: 2px solid var(--red);
}


.chart-top {
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 5px 12px 0;
}


.chart-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
}


.chart-kicker {
  color: var(--muted);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}


.chart-title {
  font-size: 13px;
  font-weight: 800;
}


.chart-help {
  color: var(--muted);
  font-size: 8px;
}


#mainChart {
  height: 210px;
}


/* ==========================================================
   FOOTER
   ========================================================== */

.footer {
  margin-top: 5px;

  display: flex;
  justify-content: space-between;
  gap: 10px;

  color: var(--muted);

  font-size: 7.5px;
}


/* ==========================================================
   RESPONSIVE
   ========================================================== */

@media (max-width: 900px) {

  .topbar {
    grid-template-columns: 1fr;
  }


  .ku-logo {
    height: auto;
    width: min(250px, 75vw);
  }


  .upper-grid {
    grid-template-columns: 1fr;
  }


  .current-grid {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }


  .metric {
    height: 86px;
  }


  #map {
    height: 210px;
  }


  #mainChart {
    height: 250px;
  }


  .footer {
    display: block;
  }

}

</style>

</head>

<div class="page">

  <div class="topbar">

        class="subtitle"

      </div>

        </div>

          <strong id="latestBoxTime">

        class="current-grid"

    <!-- MAP -->

    <div class="panel map-panel">


      <div id="map">
      </div>

        <div
          class="station-name"
          id="stationName">

        </div>


        <div class="station-meta">

          <span id="stationDescription">

          </span>

          <br>

          <span id="stationPosition">

          </span>

          Latest:

            id="sourceBadge"
            class="source-badge">

    </span>

<script>

/*
  COMPACT DASHBOARD
  Exactly 10 measurement boxes.
  No weekly or monthly summary boxes.
*/


const FRESH_HOURS = 5;


/* ==========================================================
   EXACTLY TEN MEASUREMENTS
   ========================================================== */

const MEASUREMENTS = [

  "temperature",

  "wind_speed",

  "wind_direction",

  "humidity",

  "pressure",

  "precipitation",

  "boom_height",

  "downward_radiation",

  "upward_radiation",

  "albedo"

];


const META = {

  temperature: {
    label: "Air temperature",
    unit: "°C",
    digits: 1
  },

  wind_speed: {
    label: "Wind speed",
    unit: "m/s",
    digits: 1
  },

  wind_direction: {
    label: "Wind direction",
    unit: "°",
    digits: 0
  },

  humidity: {
    label: "Relative humidity",
    unit: "%",
    digits: 0
  },

  pressure: {
    label: "Air pressure",
    unit: "hPa",
    digits: 0
  },

  precipitation: {
    label: "Precipitation",
    unit: "mm",
    digits: 1
  },

  boom_height: {
    label: "Boom height",
    unit: "m",
    digits: 2
  },

  downward_radiation: {
    label: "Downward radiation",
    unit: "W/m²",
    digits: 0
  },

  upward_radiation: {
    label: "Upward radiation",
    unit: "W/m²",
    digits: 0
  },

  albedo: {
    label: "Albedo",
    unit: "",
    digits: 2
  }

};


let DATA = null;

let activeStation = "SER_B";

let selectedMeasurement = "temperature";

let map = null;

let markers = {};



/* ==========================================================
   BASIC HELPERS
   ========================================================== */

function isNumber(value) {

  return (
    value !== null
    &&
    value !== undefined
    &&
    value !== ""
    &&
    Number.isFinite(
      Number(value)
    )
  );

}



function fmt(
  value,
  digits = 1
) {

  if (!isNumber(value)) {
    return "—";
  }

  return Number(value)
    .toFixed(digits);

}



function parseUTC(timestamp) {

  if (!timestamp) {
    return null;
  }


  let text =
    String(timestamp);


  if (
    !text.endsWith("Z")
    &&
    !/[+-]\d\d:\d\d$/.test(text)
  ) {

    text += "Z";

  }


  const date =
    new Date(text);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return date;

}



function formatUTC(timestamp) {

  const date =
    parseUTC(timestamp);


  if (!date) {
    return "—";
  }


  return (
    date.toLocaleString(

      "en-GB",

      {
        timeZone: "UTC",
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }

    )
    +
    " UTC"
  );

}



function observationAgeHours(timestamp) {

  const date =
    parseUTC(timestamp);


  if (!date) {
    return Infinity;
  }


  return (
    Date.now()
    -
    date.getTime()
  )
  /
  3600000;

}



/* ==========================================================
   ALBEDO
   ========================================================== */

function calculateAlbedo(
  upward,
  downward
) {

  if (
    !isNumber(upward)
    ||
    !isNumber(downward)
  ) {

    return null;

  }


  const down =
    Number(downward);


  if (down <= 5) {
    return null;
  }


  const value =
    Number(upward) / down;


  if (
    value < 0
    ||
    value > 1.2
  ) {

    return null;

  }


  return value;

}



/* ==========================================================
   GET LATEST MEASUREMENT
   ========================================================== */

function getLatestMeasurement(
  station,
  key
) {

  const meta =
    META[key];


  /*
    Use backend value if available.
  */

  if (
    station.latest_measurements
    &&
    station.latest_measurements[key]
  ) {

    const source =
      station.latest_measurements[key];


    if (
      isNumber(source.value)
    ) {

      return {

        label:
          meta.label,

        unit:
          meta.unit,

        digits:
          meta.digits,

        value:
          Number(source.value),

        time:
          source.time

      };

    }

  }


  /*
    If albedo does not exist in weather.json,
    calculate it from radiation.
  */

  if (
    key === "albedo"
    &&
    station.latest_measurements
  ) {

    const upward =
      station.latest_measurements[
        "upward_radiation"
      ];


    const downward =
      station.latest_measurements[
        "downward_radiation"
      ];


    const value =
      calculateAlbedo(
        upward?.value,
        downward?.value
      );


    if (isNumber(value)) {

      const time =
        upward?.time
        ||
        downward?.time
        ||
        null;


      return {

        label:
          "Albedo",

        unit:
          "",

        digits:
          2,

        value:
          value,

        time:
          time

      };

    }

  }


  return {

    label:
      meta.label,

    unit:
      meta.unit,

    digits:
      meta.digits,

    value:
      null,

    time:
      null

  };

}



/* ==========================================================
   GET HISTORY
   ========================================================== */

function historyValue(
  row,
  key
) {

  /*
    Direct variable.
  */

  if (
    key !== "albedo"
  ) {

    return isNumber(
      row[key]
    )
      ?
      Number(row[key])
      :
      null;

  }


  /*
    Existing albedo from backend.
  */

  if (
    isNumber(
      row.albedo
    )
  ) {

    return Number(
      row.albedo
    );

  }


  /*
    Otherwise derive albedo.
  */

  return calculateAlbedo(

    row.upward_radiation,

    row.downward_radiation

  );

}



/* ==========================================================
   NEWEST TIME
   ========================================================== */

function newestMeasurementTime(
  station
) {

  const times = [];


  MEASUREMENTS.forEach(
    key => {

      const item =
        getLatestMeasurement(
          station,
          key
        );


      if (
        item.time
      ) {

        times.push(
          item.time
        );

      }

    }
  );


  if (!times.length) {
    return null;
  }


  times.sort(
    (a,b) =>
      new Date(b)
      -
      new Date(a)
  );


  return times[0];

}



/* ==========================================================
   TEN OBSERVATION BOXES
   ========================================================== */

function renderLatestMeasurements(
  station
) {

  const grid =
    document.getElementById(
      "latestMetricsGrid"
    );


  grid.innerHTML = "";


  /*
    This loop ALWAYS runs exactly 10 times.
  */

  MEASUREMENTS.forEach(
    key => {


      const item =
        getLatestMeasurement(
          station,
          key
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "metric";


      if (
        key ===
        selectedMeasurement
      ) {

        card.classList.add(
          "selected"
        );

      }


      if (
        !isNumber(
          item.value
        )
      ) {

        card.classList.add(
          "no-data"
        );

      }



      const label =
        document.createElement(
          "div"
        );


      label.className =
        "metric-label";


      label.textContent =
        item.label;



      const value =
        document.createElement(
          "div"
        );


      value.className =
        "metric-value";


      const numberText =
        fmt(
          item.value,
          item.digits
        );


      value.textContent =
        numberText;



      if (
        item.unit
      ) {

        const unit =
          document.createElement(
            "span"
          );


        unit.className =
          "unit";


        unit.textContent =
          item.unit;


        value.appendChild(
          unit
        );

      }



      const time =
        document.createElement(
          "div"
        );


      time.className =
        "metric-time";


      time.textContent =
        item.time
        ?
        formatUTC(
          item.time
        )
        :
        "No observation";



      card.appendChild(
        label
      );


      card.appendChild(
        value
      );


      card.appendChild(
        time
      );


      card.onclick =
        () => {

          selectedMeasurement =
            key;


          renderLatestMeasurements(
            station
          );


          renderMainChart(
            station
          );

        };


      grid.appendChild(
        card
      );

    }
  );

}



/* ==========================================================
   SINGLE GRAPH
   ========================================================== */

function renderMainChart(
  station
) {

  const meta =
    META[
      selectedMeasurement
    ];


  document
    .getElementById(
      "chartTitle"
    )
    .textContent =
      meta.label;


  const x =
    station.history.map(
      row =>
        row.time
    );


  const y =
    station.history.map(
      row =>
        historyValue(
          row,
          selectedMeasurement
        )
    );


  Plotly.react(

    "mainChart",

    [

      {

        x:
          x,

        y:
          y,

        type:
          "scatter",

        mode:
          "lines",

        connectgaps:
          false,

        line: {
          width: 2
        },

        hovertemplate:
          "%{x|%d %b %Y %H:%M} UTC<br>"
          +
          `%{y:.${meta.digits}f} ${meta.unit}`
          +
          "<extra></extra>"

      }

    ],


    {

      margin: {
        l: 58,
        r: 16,
        t: 6,
        b: 35
      },


      xaxis: {
        title: {
          text: "UTC",
          font: {
            size: 9
          }
        },

        tickfont: {
          size: 8
        },

        automargin: true
      },


      yaxis: {

        title: {
          text:
            meta.unit
            ?
            meta.unit
            :
            meta.label,

          font: {
            size: 9
          }
        },

        tickfont: {
          size: 8
        },

        automargin: true

      },


      paper_bgcolor:
        "rgba(0,0,0,0)",


      plot_bgcolor:
        "rgba(0,0,0,0)",


      font: {
        family:
          "Inter, system-ui, sans-serif"
      },


      showlegend:
        false

    },


    {
      responsive: true,
      displaylogo: false
    }

  );

}



/* ==========================================================
   STATUS
   ========================================================== */

function renderStatus(
  station
) {

  const timestamp =
    newestMeasurementTime(
      station
    );


  const dot =
    document.getElementById(
      "statusDot"
    );


  const text =
    document.getElementById(
      "statusText"
    );


  dot.className =
    "dot";


  if (!timestamp) {

    dot.classList.add(
      "warn"
    );

    text.textContent =
      "NO DATA";

    return;

  }


  if (
    observationAgeHours(
      timestamp
    )
    <=
    FRESH_HOURS
  ) {

    dot.classList.add(
      "good"
    );

    text.textContent =
      "LIVE";

  }

  else {

    dot.classList.add(
      "warn"
    );

    text.textContent =
      "DELAYED";

  }

}



/* ==========================================================
   MAP
   ========================================================== */

function initMap() {

  map =
    L.map(
      "map",
      {
        zoomControl: true,
        scrollWheelZoom: false
      }
    )
    .setView(
      [
        65.69,
        -37.86
      ],
      11
    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom: 18,

      attribution:
        "&copy; OpenStreetMap contributors"
    }

  )
  .addTo(
    map
  );



  Object.values(
    DATA.stations
  )
  .forEach(
    station => {


      const marker =
        L.circleMarker(

          [
            station.latitude,
            station.longitude
          ],

          {
            radius: 6,
            weight: 2,
            fillOpacity: .9
          }

        )
        .addTo(
          map
        );


      marker.bindTooltip(
        station.name
      );


      marker.on(
        "click",
        () =>
          selectStation(
            station.id
          )
      );


      markers[
        station.id
      ] =
        marker;

    }
  );



  const points =
    Object.values(
      DATA.stations
    )
    .map(
      station => [
        station.latitude,
        station.longitude
      ]
    );


  if (
    points.length > 1
  ) {

    map.fitBounds(
      points,
      {
        padding: [20,20]
      }
    );

  }

}



/* ==========================================================
   STATION BUTTONS
   ========================================================== */

function renderTabs() {

  const holder =
    document.getElementById(
      "stationTabs"
    );


  holder.innerHTML =
    "";


  Object.values(
    DATA.stations
  )
  .forEach(
    station => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "station-btn"
        +
        (
          station.id ===
          activeStation
          ?
          " active"
          :
          ""
        );


      button.textContent =
        station.name;


      button.onclick =
        () =>
          selectStation(
            station.id
          );


      holder.appendChild(
        button
      );

    }
  );

}



/* ==========================================================
   SELECT STATION
   ========================================================== */

function selectStation(id) {

  if (
    !DATA.stations[id]
  ) {
    return;
  }


  activeStation =
    id;


  /*
    Temperature selected by default
    every time station changes.
  */

  selectedMeasurement =
    "temperature";


  const station =
    DATA.stations[id];


  renderTabs();


  document
    .getElementById(
      "pageTitle"
    )
    .textContent =
      `${station.name} weather`;


  document
    .getElementById(
      "pageSubtitle"
    )
    .textContent =
      `${station.description} · hourly observations from GEUS / PROMICE`;


  renderLatestMeasurements(
    station
  );


  renderMainChart(
    station
  );


  renderStatus(
    station
  );


  const newest =
    newestMeasurementTime(
      station
    );


  const newestText =
    newest
    ?
    formatUTC(
      newest
    )
    :
    "No observations";


  document
    .getElementById(
      "latestBoxTime"
    )
    .textContent =
      newestText;


  document
    .getElementById(
      "latestTime"
    )
    .textContent =
      newestText;



  const note =
    document.getElementById(
      "delayedNote"
    );


  if (
    newest
    &&
    observationAgeHours(
      newest
    )
    >
    FRESH_HOURS
  ) {

    note.style.display =
      "block";


    note.textContent =
      "Data transmission is delayed. Latest available values remain displayed.";

  }

  else {

    note.style.display =
      "none";

  }



  document
    .getElementById(
      "stationName"
    )
    .textContent =
      station.name;


  document
    .getElementById(
      "stationDescription"
    )
    .textContent =
      station.description;


  document
    .getElementById(
      "stationPosition"
    )
    .textContent =
      `${station.latitude.toFixed(4)}° N, `
      +
      `${Math.abs(station.longitude).toFixed(4)}° W · `
      +
      `${station.elevation_m} m a.s.l.`;


  document
    .getElementById(
      "sourceBadge"
    )
    .textContent =
      station.source;


  if (
    map
    &&
    markers[id]
  ) {

    map.flyTo(

      [
        station.latitude,
        station.longitude
      ],

      12,

      {
        duration: .4
      }

    );


    markers[id]
      .openTooltip();

  }

}



/* ==========================================================
   LOAD DATA
   ========================================================== */

async function loadWeather() {

  const response =
    await fetch(

      "weather.json?t="
      +
      Date.now(),

      {
        cache: "no-store"
      }

    );


  if (!response.ok) {

    throw new Error(
      "Could not load weather.json"
    );

  }


  DATA =
    await response.json();


  document
    .getElementById(
      "generatedTime"
    )
    .textContent =
      formatUTC(
        DATA.generated_at
      );


  if (
    !DATA.stations[
      activeStation
    ]
  ) {

    activeStation =
      Object.keys(
        DATA.stations
      )[0];

  }


  renderTabs();


  if (!map) {
    initMap();
  }


  selectStation(
    activeStation
  );

}



/* ==========================================================
   START
   ========================================================== */

loadWeather()
  .catch(
    error => {

      console.error(
        error
      );


      document
        .getElementById(
          "statusText"
        )
        .textContent =
          "DATA ERROR";


      document
        .getElementById(
          "statusDot"
        )
        .className =
          "dot warn";

    }
  );



setInterval(

  () =>
    loadWeather()
      .catch(
        console.error
      ),

  5 * 60 * 1000

);


</script>
