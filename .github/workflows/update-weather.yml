name: Update and publish weather dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Fetch latest weather data
        run: python fetch_weather.py


      - name: Commit updated weather.json
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Update weather data"
          git push


      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp weather.json site/weather.json

          if [ -d "assets" ]; then
            cp -r assets site/assets
          fi


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
